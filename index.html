<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WFM Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --border:#e3e6ee;
  --text:#121826; --muted:#667085; --faint:#98a2b3;
  --primary:#3456d6; --primary-hover:#2944b5; --primary-soft:#e8edfc; --primary-ink:#fff;
  --ok:#0f8a5f; --ok-soft:#e3f6ee; --warn:#b45309; --warn-soft:#fff3df;
  --bad:#c0362c; --bad-soft:#fdeceb; --neutral:#5b6475; --neutral-soft:#eef0f4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1118; --surface:#161a23; --surface-2:#1e2330; --border:#2a3040;
    --text:#e8ebf2; --muted:#9aa3b5; --faint:#6b7489;
    --primary:#6d8cff; --primary-hover:#86a0ff; --primary-soft:#1f2a4d; --primary-ink:#0e1118;
    --ok:#4cd39b; --ok-soft:#163327; --warn:#f5b454; --warn-soft:#3a2a12;
    --bad:#ff7a70; --bad-soft:#3d1a18; --neutral:#a7b0c2; --neutral-soft:#252b38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15px;white-space:nowrap}
.proto{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 7px;border-radius:6px;white-space:nowrap}
.role-toggle{margin-left:auto;display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.role-toggle button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.role-toggle button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.me-text{line-height:1.2}
.me-text b{display:block;font-size:13px}
.me-text span{font-size:12px;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:244px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:60px;height:calc(100vh - 60px)}
.side-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;border:0;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.side-foot button{margin-top:8px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.side-foot button:hover{color:var(--text)}
main{padding:28px 36px 56px;width:100%;max-width:1120px}

.bottom-nav{display:none}

/* Page header */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;font-weight:500}
.back:hover{color:var(--text)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card h2{font-size:15px;margin:0 0 14px}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* Type picker */
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.type-card{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.type-card:hover{transform:translateY(-2px);border-color:var(--c)}
.type-card b{font-size:15px}
.type-card span{color:var(--muted);font-size:13px}
.bubble{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.bubble.sm{width:34px;height:34px;border-radius:10px}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field label .req{color:var(--bad)}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .12s,box-shadow .12s}
.field textarea{min-height:90px;resize:vertical}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.requester{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);margin-bottom:18px}
.requester small{display:block;color:var(--muted);font-size:12px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px}

/* Pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.cancelled{background:var(--neutral-soft);color:var(--neutral)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.chip .n{opacity:.65;margin-left:4px}

/* Request list cards */
.req-list{display:flex;flex-direction:column;gap:10px}
.req-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer}
.req-card:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.req-main{flex:1;min-width:0}
.req-title{font-weight:600;display:flex;gap:8px;align-items:center}
.req-title small{color:var(--faint);font-weight:500;font-size:12px}
.req-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-meta{color:var(--faint);font-size:12px;margin-top:2px}
.req-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.quick{display:flex;gap:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat span{color:var(--muted);font-size:12.5px;font-weight:500}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:4px}
.stat small{color:var(--faint);font-size:12px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--c)}
.bar-row b{text-align:right}

/* Flow */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow-step{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.flow-step.planned{background:none;border:1.5px dashed var(--border);color:var(--faint)}
.flow-arrow{color:var(--faint)}
.flow-note{color:var(--muted);font-size:12.5px;margin-top:12px}

/* Filters & table */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:36px}
.filters select{width:auto;min-width:150px}
.count{color:var(--muted);font-size:13px;margin-bottom:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell-type{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.mobile-only{display:none}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* Export */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.exp-summary{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--primary-soft);margin-bottom:16px}
.exp-summary b{font-size:26px;color:var(--primary)}
.exp-summary span{color:var(--muted);font-size:13px}
.sheet-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sheet-tab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--surface-2);color:var(--muted)}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.d-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.d-head h3{margin:0;font-size:16px}
.d-head small{color:var(--faint)}
.d-head .btn{margin-left:auto}
.d-body{flex:1;overflow-y:auto;padding:20px}
.d-section{margin-bottom:22px}
.d-section h4{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:600;font-size:13.5px}
.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.t-item{position:relative;padding-bottom:14px}
.t-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.t-item.approved::before{border-color:var(--ok);background:var(--ok)}
.t-item.rejected::before{border-color:var(--bad);background:var(--bad)}
.t-item.cancelled::before{border-color:var(--neutral)}
.t-item b{font-size:13.5px}
.t-item span{display:block;font-size:12px;color:var(--muted)}
.t-item em{display:block;font-style:normal;font-size:13px;margin-top:4px;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.d-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.d-foot .row{display:flex;gap:10px}
.d-foot .row .btn{flex:1}
.sheet-handle{display:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:500;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}

/* Responsive */
@media (max-width:1000px){
  .grid-2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .topbar{padding:0 16px}
  .me-text,.proto{display:none}
  .role-toggle button{padding:7px 11px}
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:600;color:var(--faint);position:relative;border-radius:10px}
  .bottom-nav button.on{color:var(--primary)}
  .bottom-nav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:10px}
  .page-head h1{font-size:20px}
  .type-grid{grid-template-columns:1fr 1fr;gap:10px}
  .type-card{padding:14px;gap:10px}
  .type-card span{font-size:12px}
  .form-grid{grid-template-columns:1fr}
  .form-actions .btn{flex:1}
  .stats{gap:10px}
  .stat b{font-size:24px}
  .desktop-only{display:none}
  .mobile-only{display:block}
  .filters select{flex:1;min-width:0}
  .req-card{padding:12px 13px;gap:12px}
  .drawer{top:auto;left:0;width:100%;max-height:90vh;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .drawer.open{transform:none}
  .sheet-handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0}
  .d-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){
  .brand-name{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" id="logoIcon"></div>
    <span class="brand-name">WFM Requests</span>
    <span class="proto">Prototype</span>
  </div>
  <div class="role-toggle" role="tablist" aria-label="Preview as">
    <button data-action="role" data-role="staff">Staff</button>
    <button data-action="role" data-role="manager">Manager</button>
  </div>
  <div class="me">
    <div class="avatar" id="meAvatar"></div>
    <div class="me-text"><b id="meName"></b><span id="meTeam"></span></div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<div class="overlay" id="overlay" data-action="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script>
/* ---------- Icons ---------- */
const ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  swap:'<path d="M16 3l4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7l10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>'
};
const icon=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- Helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dOff=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
const fmtD=s=>{if(!s)return '—';const d=new Date(s+'T00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const fmtShort=s=>{if(!s)return '—';const d=new Date(s+'T00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const fmtDT=s=>{const d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const fmtXlDT=s=>{const d=new Date(s);return `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const days=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)+1;
const ago=s=>{const m=Math.round((Date.now()-new Date(s))/6e4);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';const d=Math.round(h/24);return d+'d ago'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const shortShift=s=>(s||'').split(' (')[0];

/* ---------- Staff: New request ---------- */
function fieldHTML(f){
  const req=f.req?' required':'';
  const lbl=`<label for="f_${f.k}">${f.label}${f.req?' <span class="req">*</span>':''}</label>`;
  let ctrl;
  if(f.type==='select'){
    ctrl=`<select id="f_${f.k}" name="${f.k}"${req}><option value="">Select…</option>${f.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  }else{
    const extra=(f.min!=null?` min="${f.min}"`:'')+(f.max!=null?` max="${f.max}"`:'')+(f.step?` step="${f.step}"`:'')+(f.ph?` placeholder="${esc(f.ph)}"`:'');
    ctrl=`<input id="f_${f.k}" name="${f.k}" type="${f.type}"${req}${extra}>`;
  }
  return `<div class="field${f.full?' full':''}">${lbl}${ctrl}</div>`;
}
function viewNew(){
  if(!S.type){
    return `<div class="page-head"><div><h1>New request</h1><p>What would you like to request?</p></div></div>
    <div class="type-grid">${Object.entries(TYPES).map(([k,t])=>`
      <button class="type-card" style="--c:${t.color}" data-action="pickType" data-type="${k}">
        ${bubble(k)}<div><b>${t.label}</b><br><span>${t.desc}</span></div>
      </button>`).join('')}</div>`;
  }
  const t=TYPES[S.type];
  return `<button class="back" data-action="backTypes">${icon('back',16)} All request types</button>
  <div class="page-head"><div style="display:flex;gap:14px;align-items:center">${bubble(S.type)}<div><h1>${t.label}</h1><p>${t.desc}</p></div></div></div>
  <form class="card card-pad" id="reqForm" novalidate>
    <div class="requester"><div class="avatar">${initials(ME.name)}</div><div><b>${ME.name}</b> · ${ME.id}<small>${ME.team} · filled in automatically from your login</small></div></div>
    <div class="form-grid">
      ${t.fields.map(fieldHTML).join('')}
      <div class="field full"><label for="f_notes">Notes</label><textarea id="f_notes" name="notes" placeholder="Anything your manager should know (optional)"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" data-action="backTypes">Cancel</button>
      <button type="submit" class="btn primary">${icon('check',16)} Submit request</button>
    </div>
  </form>`;
}
function submitRequest(form){
  const t=TYPES[S.type];
  const fd=new FormData(form);
  const data={};
  for(const f of t.fields){
    let v=(fd.get(f.k)||'').toString().trim();
    if(f.req&&!v){toast(`Please fill in “${f.label}”`,true);form.querySelector(`[name="${f.k}"]`).focus();return}
    if(f.type==='number'&&v)v=Number(v);
    data[f.k]=v;
  }
  if(data.start&&data.end&&data.end<data.start){toast('End date can’t be before start date',true);return}
  if(S.type==='swap'&&data.myShift===data.theirShift){toast('The two shifts are the same',true);return}
  const nextNum=Math.max(1000,...S.reqs.map(r=>+r.id.split('-')[1]))+1;
  const now=new Date().toISOString();
  const req={id:'REQ-'+nextNum,type:S.type,requester:ME,created:now,status:'pending',data,notes:(fd.get('notes')||'').toString().trim(),history:[{at:now,by:ME.name,action:'Submitted'}]};
  S.reqs.push(req);save();
  S.type=null;S.view='mine';S.mineStatus='all';
  render();toast(`${req.id} submitted`);
}

  const {q,type,status}=S.filters;const qq=q.toLowerCase();
  return S.reqs.filter(r=>(type==='all'||r.type===type)&&(status==='all'||r.status===status)&&
    (!qq||[r.id,r.requester.name,r.requester.id,r.requester.team,TYPES[r.type].label,TYPES[r.type].summary(r.data)].join(' ').toLowerCase().includes(qq))

const BASE_COLS=['Request ID','Type','Employee','Employee ID','Team','Submitted','Status','Decided By','Decided On','Decision Comment'];
function rowFor(r,fields){
  const row={'Request ID':r.id,'Type':TYPES[r.type].label,'Employee':r.requester.name,'Employee ID':r.requester.id,'Team':r.requester.team,
    'Submitted':fmtXlDT(r.created),'Status':STATUS[r.status],'Decided By':r.decidedBy||'','Decided On':r.decidedAt?fmtXlDT(r.decidedAt):'','Decision Comment':r.decisionComment||''};
  fields.forEach(f=>{row[f.label]=r.data[f.k]??''});
  row['Notes']=r.notes||'';
  return row;
}
function expList(){
  const e=S.exp;
  return S.reqs.filter(r=>{const d=isoDate(new Date(r.created));
    return d>=e.from&&d<=e.to&&e.types.has(r.type)&&(e.status==='all'||r.status===e.status)}).sort((a,b)=>new Date(a.created)-new Date(b.created));
}

function viewExport(){
  const e=S.exp;
  return `<div class="page-head"><div><h1>Export to Excel</h1><p>Generate a ready-to-use .xlsx file from submitted requests.</p></div></div>
  <div class="grid-2">
    <div class="card card-pad">
      <div class="form-grid">
        <div class="field"><label>Submitted from</label><input type="date" data-exp="from" value="${e.from}"></div>
        <div class="field"><label>Submitted to</label><input type="date" data-exp="to" value="${e.to}"></div>
        <div class="field full"><label>Request types</label>
          <div class="chips" style="margin:0">${Object.entries(TYPES).map(([k,t])=>`<button type="button" class="chip${e.types.has(k)?' on':''}" data-action="expType" data-type="${k}">${t.label}</button>`).join('')}</div></div>
        <div class="field full"><label>Status</label>
          <select data-exp="status"><option value="all">All statuses</option>${Object.entries(STATUS).map(([k,l])=>`<option value="${k}"${e.status===k?' selected':''}>${l} only</option>`).join('')}</select></div>
        <div class="field full"><label>File layout</label>
          <div class="seg">
            <button type="button" class="${e.layout==='pertype'?'on':''}" data-action="expLayout" data-layout="pertype">One sheet per type</button>
            <button type="button" class="${e.layout==='single'?'on':''}" data-action="expLayout" data-layout="single">Single sheet</button>
          </div></div>
      </div>
      <div class="form-actions"><button class="btn primary" data-action="doExport">${icon('download',16)} Download Excel file</button></div>
    </div>
    <div class="card card-pad" id="expPreview">${expPreviewHTML()}</div>
  </div>`;
}
function doExport(){
  const list=expList();
  if(!list.length){toast('Nothing to export with these settings',true);return}
  const fname=`WFM_Requests_${S.exp.from}_to_${S.exp.to}`;
  const sheetData=[];
  if(S.exp.layout==='single'){
    const seen=new Set();const fields=[];
    Object.keys(TYPES).forEach(k=>TYPES[k].fields.forEach(f=>{if(!seen.has(f.label)){seen.add(f.label);fields.push(f)}}));
    const cols=[...BASE_COLS,...fields.map(f=>f.label),'Notes'];
    sheetData.push({name:'Requests',cols,rows:list.map(r=>rowFor(r,TYPES[r.type].fields))});
  }else{
    const sum=Object.keys(TYPES).map(k=>{const l=list.filter(r=>r.type===k);
      return {'Request Type':TYPES[k].label,'Total':l.length,'Pending':l.filter(r=>r.status==='pending').length,'Approved':l.filter(r=>r.status==='approved').length,'Rejected':l.filter(r=>r.status==='rejected').length,'Cancelled':l.filter(r=>r.status==='cancelled').length}}).filter(x=>x.Total);
    sheetData.push({name:'Summary',cols:['Request Type','Total','Pending','Approved','Rejected','Cancelled'],rows:sum});
    Object.keys(TYPES).forEach(k=>{const l=list.filter(r=>r.type===k);if(!l.length)return;
      const f=TYPES[k].fields;sheetData.push({name:TYPES[k].label.slice(0,31),cols:[...BASE_COLS,...f.map(x=>x.label),'Notes'],rows:l.map(r=>rowFor(r,f))})});
  }
  if(window.XLSX){
    const wb=XLSX.utils.book_new();
    sheetData.forEach(s=>{
      const ws=XLSX.utils.json_to_sheet(s.rows,{header:s.cols});
      ws['!cols']=s.cols.map(c=>({wch:Math.min(45,Math.max(c.length,...s.rows.map(r=>String(r[c]??'').length))+2)}));
      ws['!autofilter']={ref:ws['!ref']};
      XLSX.utils.book_append_sheet(wb,ws,s.name);
    });
    XLSX.writeFile(wb,fname+'.xlsx');
    toast(`Excel file downloaded · ${list.length} requests`);
  }else{
    const s=sheetData.length>1?sheetData[1]:sheetData[0];
    const csv=[s.cols,...s.rows.map(r=>s.cols.map(c=>r[c]??''))].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=fname+'.csv';a.click();
    toast('Excel library unavailable offline — downloaded CSV instead',true);
  }
}

/* ---------- Drawer ---------- */
function renderDrawer(){
  const dr=document.getElementById('drawer'),ov=document.getElementById('overlay');
  const r=S.drawer&&getReq(S.drawer);
  if(!r){dr.classList.remove('open');ov.classList.remove('open');dr.setAttribute('aria-hidden','true');return}
  const t=TYPES[r.type];
  const isMgr=S.role==='manager';
  const canDecide=isMgr&&r.status==='pending';
  const canCancel=!isMgr&&r.status==='pending'&&r.requester.id===ME.id;
  const val=(f,v)=>f.type==='date'?fmtD(v):(v===''||v==null?'—':esc(v)+(f.k==='hours'?' h':''));
  dr.innerHTML=`<div class="sheet-handle"></div>
  <div class="d-head">${bubble(r.type,true)}<div><h3>${t.label}</h3><small>${r.id}</small></div>
    <button class="btn icon" data-action="closeDrawer" aria-label="Close">${icon('x',18)}</button></div>
  <div class="d-body">
    <div class="d-section" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">${pill(r.status)}<span class="muted" style="font-size:12.5px">Submitted ${fmtDT(r.created)}</span></div>
    <div class="d-section"><h4>Employee</h4><div class="kv">
      <div><span>Name</span><b>${esc(r.requester.name)}</b></div><div><span>Employee ID</span><b>${esc(r.requester.id)}</b></div>
      <div style="grid-column:1/-1"><span>Team</span><b>${esc(r.requester.team)}</b></div></div></div>
    <div class="d-section"><h4>Request details</h4><div class="kv">
      ${t.fields.map(f=>`<div${f.full?' style="grid-column:1/-1"':''}><span>${f.label}</span><b>${val(f,r.data[f.k])}</b></div>`).join('')}
      ${r.data.start&&r.data.end?`<div><span>Duration</span><b>${days(r.data.start,r.data.end)} day(s)</b></div>`:''}
    </div></div>
    ${r.notes?`<div class="d-section"><h4>Notes</h4><div class="note-box">${esc(r.notes)}</div></div>`:''}
    <div class="d-section"><h4>History</h4><div class="timeline">
      ${r.history.map(h=>`<div class="t-item ${h.action.toLowerCase()}"><b>${h.action}</b><span>${esc(h.by)} · ${fmtDT(h.at)}</span>${h.comment?`<em>${esc(h.comment)}</em>`:''}</div>`).join('')}
    </div></div>
  </div>
  ${canDecide?`<div class="d-foot">
    <textarea class="input" id="decisionComment" rows="2" placeholder="Comment (required when rejecting)"></textarea>
    <div class="row"><button class="btn bad" data-action="reject" data-id="${r.id}">${icon('x',16)} Reject</button>
    <button class="btn ok" data-action="approve" data-id="${r.id}">${icon('check',16)} Approve</button></div></div>`:''}
  ${canCancel?`<div class="d-foot"><button class="btn bad" data-action="cancelReq" data-id="${r.id}">Cancel this request</button></div>`:''}`;
  dr.classList.add('open');ov.classList.add('open');dr.setAttribute('aria-hidden','false');
}
function decide(id,status,comment){
  const r=getReq(id);if(!r||r.status!=='pending')return;
  const at=new Date().toISOString();
  r.status=status;r.decidedBy=MANAGER.name;r.decidedAt=at;r.decisionComment=comment||'';
  r.history.push({at,by:MANAGER.name,action:STATUS[status],comment:comment||''});
  save();render();toast(`${r.id} ${status}`);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast'+(err?' err':''),2600)}

/* ---------- Render ---------- */
const VIEWS={new:viewNew,mine:viewMine,dash:viewDash,all:viewAll,export:viewExport};
function render(){
  renderNav();
  document.getElementById('main').innerHTML=VIEWS[S.view]();
  renderDrawer();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'role': if(S.role!==el.dataset.role){S.role=el.dataset.role;S.view=S.role==='staff'?'new':'dash';S.type=null;S.drawer=null;render();window.scrollTo(0,0)} break;
    case 'nav': S.view=el.dataset.view;S.type=null;S.drawer=null;render();window.scrollTo(0,0);break;
    case 'pickType': S.type=el.dataset.type;render();window.scrollTo(0,0);break;
    case 'backTypes': S.type=null;render();break;
    case 'mineStatus': S.mineStatus=el.dataset.status;render();break;
    case 'open': S.drawer=id;renderDrawer();break;
    case 'closeDrawer': S.drawer=null;renderDrawer();break;
    case 'approve': {const c=document.getElementById('decisionComment');decide(id,'approved',c&&S.drawer===id?c.value.trim():'');break}
    case 'reject': {const c=document.getElementById('decisionComment');const v=c?c.value.trim():'';if(!v){toast('Please add a comment explaining the rejection',true);c&&c.focus();return}decide(id,'rejected',v);break}
    case 'quickReject': S.drawer=id;renderDrawer();setTimeout(()=>{const c=document.getElementById('decisionComment');c&&c.focus()},250);break;
    case 'cancelReq': {const r=getReq(id);if(r&&r.status==='pending'){const at=new Date().toISOString();r.status='cancelled';r.history.push({at,by:ME.name,action:'Cancelled'});save();render();toast(`${r.id} cancelled`)}break}
    case 'goPending': S.view='all';S.filters={q:'',type:'all',status:'pending'};render();break;
    case 'expType': {const k=el.dataset.type;S.exp.types.has(k)?S.exp.types.delete(k):S.exp.types.add(k);el.classList.toggle('on');document.getElementById('expPreview').innerHTML=expPreviewHTML();break}
    case 'expLayout': S.exp.layout=el.dataset.layout;render();break;
    case 'doExport': doExport();break;
    case 'reset': if(confirm('Reset all demo requests to the sample data?')){S.reqs=seed();save();S.drawer=null;render();toast('Demo data reset')}break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.drawer){S.drawer=null;renderDrawer()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.req-card')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{if(e.target.id==='reqForm'){e.preventDefault();submitRequest(e.target)}});
document.addEventListener('input',e=>{
  const f=e.target.dataset.filter;
  if(f){S.filters[f]=e.target.value;document.getElementById('results').innerHTML=resultsHTML()}
});
document.addEventListener('change',e=>{
  const x=e.target.dataset.exp;
  if(x){S.exp[x]=e.target.value;document.getElementById('expPreview').innerHTML=expPreviewHTML()}
});

/* ---------- Init ---------- */
document.getElementById('logoIcon').innerHTML=icon('layers',18);
render();
</script>
</body>
</html>
