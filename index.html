<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFM Requests</title>
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f2f7; --border:#e3e6ee;
  --text:#121826; --muted:#667085; --faint:#98a2b3;
  --primary:#3456d6; --primary-hover:#2944b5; --primary-soft:#e8edfc; --primary-ink:#fff;
  --ok:#0f8a5f; --ok-soft:#e3f6ee; --warn:#b45309; --warn-soft:#fff3df;
  --bad:#c0362c; --bad-soft:#fdeceb; --neutral:#5b6475; --neutral-soft:#eef0f4;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1118; --surface:#161a23; --surface-2:#1e2330; --border:#2a3040;
    --text:#e8ebf2; --muted:#9aa3b5; --faint:#6b7489;
    --primary:#6d8cff; --primary-hover:#86a0ff; --primary-soft:#1f2a4d; --primary-ink:#0e1118;
    --ok:#4cd39b; --ok-soft:#163327; --warn:#f5b454; --warn-soft:#3a2a12;
    --bad:#ff7a70; --bad-soft:#3d1a18; --neutral:#a7b0c2; --neutral-soft:#252b38;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* Top bar */
.topbar{position:sticky;top:0;z-index:30;height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:15px;white-space:nowrap}
.proto{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 7px;border-radius:6px;white-space:nowrap}
.role-toggle{margin-left:auto;display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.role-toggle button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.role-toggle button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.me{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.me-text{line-height:1.2}
.me-text b{display:block;font-size:13px}
.me-text span{font-size:12px;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:244px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:60px;height:calc(100vh - 60px)}
.side-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;border:0;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--primary-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.side-foot button{margin-top:8px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.side-foot button:hover{color:var(--text)}
main{padding:28px 36px 56px;width:100%;max-width:1120px}

.bottom-nav{display:none}

/* Page header */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;font-weight:500}
.back:hover{color:var(--text)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card h2{font-size:15px;margin:0 0 14px}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* Type picker */
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.type-card{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.type-card:hover{transform:translateY(-2px);border-color:var(--c)}
.type-card b{font-size:15px}
.type-card span{color:var(--muted);font-size:13px}
.bubble{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.bubble.sm{width:34px;height:34px;border-radius:10px}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600}
.field label .req{color:var(--bad)}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .12s,box-shadow .12s}
.field textarea{min-height:90px;resize:vertical}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.requester{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);margin-bottom:18px}
.requester small{display:block;color:var(--muted);font-size:12px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--border))}
.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px}

/* Pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.rejected{background:var(--bad-soft);color:var(--bad)}
.pill.cancelled{background:var(--neutral-soft);color:var(--neutral)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.chip .n{opacity:.65;margin-left:4px}

/* Request list cards */
.req-list{display:flex;flex-direction:column;gap:10px}
.req-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer}
.req-card:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--border))}
.req-main{flex:1;min-width:0}
.req-title{font-weight:600;display:flex;gap:8px;align-items:center}
.req-title small{color:var(--faint);font-weight:500;font-size:12px}
.req-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-meta{color:var(--faint);font-size:12px;margin-top:2px}
.req-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.quick{display:flex;gap:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat span{color:var(--muted);font-size:12.5px;font-weight:500}
.stat b{display:block;font-size:28px;letter-spacing:-.02em;margin-top:4px}
.stat small{color:var(--faint);font-size:12px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px 1fr 28px;align-items:center;gap:10px;font-size:13px}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--c)}
.bar-row b{text-align:right}

/* Flow */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow-step{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.flow-step.planned{background:none;border:1.5px dashed var(--border);color:var(--faint)}
.flow-arrow{color:var(--faint)}
.flow-note{color:var(--muted);font-size:12.5px;margin-top:12px}

/* Filters & table */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{padding-left:36px}
.filters select{width:auto;min-width:150px}
.count{color:var(--muted);font-size:13px;margin-bottom:10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell-type{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.mobile-only{display:none}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* Export */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.exp-summary{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--primary-soft);margin-bottom:16px}
.exp-summary b{font-size:26px;color:var(--primary)}
.exp-summary span{color:var(--muted);font-size:13px}
.sheet-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sheet-tab{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;background:var(--surface-2);color:var(--muted)}

/* Drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.open{transform:none}
.d-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.d-head h3{margin:0;font-size:16px}
.d-head small{color:var(--faint)}
.d-head .btn{margin-left:auto}
.d-body{flex:1;overflow-y:auto;padding:20px}
.d-section{margin-bottom:22px}
.d-section h4{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-weight:600;font-size:13.5px}
.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.t-item{position:relative;padding-bottom:14px}
.t-item::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.t-item.approved::before{border-color:var(--ok);background:var(--ok)}
.t-item.rejected::before{border-color:var(--bad);background:var(--bad)}
.t-item.cancelled::before{border-color:var(--neutral)}
.t-item b{font-size:13.5px}
.t-item span{display:block;font-size:12px;color:var(--muted)}
.t-item em{display:block;font-style:normal;font-size:13px;margin-top:4px;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.d-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.d-foot .row{display:flex;gap:10px}
.d-foot .row .btn{flex:1}
.sheet-handle{display:none}

/* Toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:10px;font-weight:500;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}

/* Responsive */
@media (max-width:1000px){
  .grid-2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .topbar{padding:0 16px}
  .me-text,.proto{display:none}
  .role-toggle button{padding:7px 11px}
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:600;color:var(--faint);position:relative;border-radius:10px}
  .bottom-nav button.on{color:var(--primary)}
  .bottom-nav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:10px}
  .page-head h1{font-size:20px}
  .type-grid{grid-template-columns:1fr 1fr;gap:10px}
  .type-card{padding:14px;gap:10px}
  .type-card span{font-size:12px}
  .form-grid{grid-template-columns:1fr}
  .form-actions .btn{flex:1}
  .stats{gap:10px}
  .stat b{font-size:24px}
  .desktop-only{display:none}
  .mobile-only{display:block}
  .filters select{flex:1;min-width:0}
  .req-card{padding:12px 13px;gap:12px}
  .drawer{top:auto;left:0;width:100%;max-height:90vh;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .drawer.open{transform:none}
  .sheet-handle{display:block;width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0}
  .d-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
}
@media (max-width:380px){
  .brand-name{display:none}
}

.static-note{max-width:1120px;margin:0 auto;padding:16px 20px 0;color:var(--muted);font-size:13px}
.toc{max-width:1120px;margin:0 auto;padding:12px 20px 4px;display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:12.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:6px 10px;border-radius:8px;text-decoration:none}
.screen{max-width:1120px;margin:0 auto;padding:28px 20px 8px}
.screen-label{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
.screen-label b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.screen-label span{color:var(--muted);font-size:13px}
.frame{background:var(--bg);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.frame-body{padding:22px}
.frame-nav{display:flex;border-top:1px solid var(--border);background:var(--surface);padding:6px}
.frame-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:600;color:var(--faint);position:relative}
.frame-nav button.on{color:var(--primary)}
.frame-nav .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;height:17px;min-width:17px;font-size:10px}
.drawer-static{background:var(--surface);display:flex;flex-direction:column}
.drawer-static .d-head .btn{display:none}
.drawer-static .sheet-handle{display:none}
.topbar{position:static}
@media (max-width:820px){.frame-body{padding:16px}.screen{padding:24px 12px 4px}.static-note,.toc{padding-left:12px;padding-right:12px}}

.type-card .bubble{color:var(--c)}
:root{--ret:#7c3aed;--ret-soft:#f1e9fe;--pink:#ec4899}
@media (prefers-color-scheme: dark){:root{--ret:#b794ff;--ret-soft:#2c2142}}
.pill.returned{background:var(--ret-soft);color:var(--ret)}
.pill.waiting{background:var(--primary-soft);color:var(--primary)}
.pill.ack{background:var(--ok-soft);color:var(--ok)}
.pill.need{background:var(--warn-soft);color:var(--warn)}
.t-item.returned::before{border-color:var(--ret);background:var(--ret)}
.t-item.waiting::before{border-color:var(--primary);background:var(--primary)}

/* Grouping */
.group-head{max-width:1120px;margin:0 auto;padding:36px 20px 0}
.group-head h2{margin:0;font-size:20px;letter-spacing:-.01em}
.group-head p{margin:4px 0 0;color:var(--muted)}
.toc .toc-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);align-self:center;margin-right:2px}
.toc .br{flex-basis:100%;height:0}

/* Sign in */
.signin{display:grid;place-items:center;padding:40px 16px}
.signin .card{width:100%;max-width:400px;padding:28px;text-align:center}
.signin .logo{width:48px;height:48px;border-radius:14px;margin:0 auto 14px}
.signin h1{font-size:20px;margin:0 0 4px}
.signin p{margin:0 0 20px;color:var(--muted)}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600}
.ms-logo{display:grid;grid-template-columns:9px 9px;gap:2px}
.ms-logo i{width:9px;height:9px;display:block}
.divider{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;margin:18px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.demo-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-roles button{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:12px;text-align:left}
.demo-roles button b{display:block;font-size:13.5px}
.demo-roles button span{font-size:12px;color:var(--muted)}

/* Locked type */
.type-card.locked{opacity:.62;cursor:not-allowed;border-style:dashed}
.type-card.locked:hover{transform:none;border-color:var(--border)}

  const blocked=blockedInRange(S.current,'leave',start,end);
  if(blocked.length){const b=blockOn(S.current,'leave',blocked[0]);return `${fmt(blocked[0])} is blocked by WFM${b&&b.reason?' ('+b.reason+')':''} — pick other dates`}
  const full=fullDaysIn(start,end,excl);
  if(full.length)return `${full.map(fmt).join(', ')} ${full.length>1?'are':'is'} full — pick other dates`;
  return '';
}
function fullDaysIn(start,end,excludeId){
  const out=[];for(let d=parse(start);d<=parse(end);d=addDays(d,1)){const s=iso(d);if(leaveUsage(s,excludeId)>=S.rules.leaveLimit)out.push(s)}return out;
}
function summary(r){
  const x=r.data;
  switch(r.type){
    case 'leave':return `${fmt(x.start)} → ${fmt(x.end)} · ${daysBetween(x.start,x.end)} day(s)`;
    case 'swap':return `${rng(x)} · ${shiftTxt(x.myShift,x.myOffDate)} ⇄ ${shiftTxt(x.theirShift,x.theirOffDate)} with ${user(r.partnerId).name}`;
    case 'change':return `${rng(x)} · ${shiftTxt(x.current,x.currentOffDate)} → ${shiftTxt(x.requested,x.requestedOffDate)}`;
    case 'dispute':return `${fmt(x.date)} · score ${fmtScore(x.score)}${x.corrected!=null?` → ${fmtScore(x.corrected)}`:''}`;
    case 'special':return `${x.schedule} · ${(x.prefs||[]).join(', ')}`;
    case 'kpi':return `${x.kpi} · ${fmt(x.date)}${r.files.length?` · ${r.files.length} attachment(s)`:''}`;
  }
}
function recSummary(r){
  const x=r.data;
  switch(r.kind){
    case 'eval':return `Score ${scoreOf(x.ratings)}% · Call on ${fmt(x.date)} · by ${user(r.createdBy).name}`;
    case 'mom':return `${x.title}${r.files.length?` · ${r.files.length} attachment(s)`:''}`;
    case 'task':return `${x.title}${x.due?` · due ${fmt(x.due)}`:''}`;
    case 'vio':return `${x.vtype} · ${fmt(x.date)}`;
    case 'adh':return `${x.reason} · ${fmt(x.date||x.from)}`;
  }
}

function calendarHtml(f){
  const m=f.cal.month,T=today(),tIso=iso(T),first=new Date(m.getFullYear(),m.getMonth(),1),dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const canPrev=first>new Date(T.getFullYear(),T.getMonth(),1);
  let h=`<div class="cal-head"><button type="button" class="btn icon sm" data-action="calMove" data-d="-1" ${canPrev?'':'disabled style="opacity:.4"'}>${ic('back',16)}</button><b>${MONL[m.getMonth()]} ${m.getFullYear()}</b><button type="button" class="btn icon sm" data-action="calMove" data-d="1">${ic('next',16)}</button></div><div class="cal">`;
  h+=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++)h+='<div class="day blank"></div>';
  const lim=S.rules.leaveLimit;
  for(let d=1;d<=dim;d++){
    const s=iso(new Date(m.getFullYear(),m.getMonth(),d));
    if(s<=tIso){h+=`<div class="day past">${d}</div>`;continue}
    const used=leaveUsage(s,f.editingId),left=lim-used;
    const {start,end}=f.cal;
    if(start&&(s===start||s===end)){h+=`<button type="button" class="day sel" data-action="calPick" data-d="${s}">${d}</button>`;continue}
    if(start&&end&&s>start&&s<end){h+=`<button type="button" class="day mid" data-action="calPick" data-d="${s}">${d}</button>`;continue}
    const bk=blockOn(S.current,'leave',s);
    if(bk){h+=`<button type="button" class="day full${f.cal.info===s?' info':''}" data-action="calInfo" data-d="${s}" title="Blocked by WFM${bk.reason?': '+esc(bk.reason):''}">${d}<small>Blocked</small></button>`;continue}
    if(left<=0){h+=`<button type="button" class="day full${f.cal.info===s?' info':''}" data-action="calInfo" data-d="${s}" title="Tap to see who is on leave">${d}<small>Full</small></button>`;continue}
    h+=`<button type="button" class="day${left===1?' low':''}" data-action="calPick" data-d="${s}">${d}${left===1?'<small>1 left</small>':''}</button>`;
  }
  h+='</div><div class="legend"><span><i style="background:var(--primary);border-color:var(--primary)"></i>Selected</span><span><i style="background:var(--warn-soft);border-color:transparent"></i>1 slot left</span><span><i style="background:repeating-linear-gradient(45deg,var(--surface-2) 0 3px,transparent 3px 6px)"></i>Full or blocked · can’t be picked</span></div>';
  const {start,end}=f.cal;
  if(start)h+=`<div class="sel-sum">${ic('cal',16)} ${end?`${fmt(start)} → ${fmt(end)} · ${daysBetween(start,end)} day(s)`:`${fmt(start)} · tap another day to set the end, or submit for 1 day`}</div>`;
  else h+=`<div class="sel-sum" style="background:var(--surface-2);color:var(--muted)">${ic('cal',16)} Tap your first day, then your last day</div>`;
  if(f.errors.dates)h+=`<div class="err-text" style="margin-top:6px">${f.errors.dates}</div>`;
  h+=f.cal.info?whoOffHtml(f.cal.info):`<div class="flow-note" style="margin-top:8px">Tip: tap a full day to see who is on leave.</div>`;
  return h;
}

/* ================= Quality analytics ================= */
const critOf=r=>r.data.criteria||DEFAULT_CRIT;
const ratingFor=(r,name)=>{const i=critOf(r).indexOf(name);return i<0?null:r.data.ratings[i]};
const critAvg=(evs,name)=>avgOf(evs.map(r=>ratingFor(r,name)).filter(v=>v!=null).map(v=>v*20));
const evalTime=r=>parse(r.data.date).getTime();
const avgOf=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const evalsOf=uid=>S.records.filter(r=>r.kind==='eval'&&r.recipients[0]===uid&&r.data.countInScore!==false).sort((a,b)=>evalTime(a)-evalTime(b));
function staffQuality(uid){
  const all=evalsOf(uid),sc=all.map(r=>scoreOf(r.data.ratings)),tgt=S.rules.qualityTarget;
  let trend='new',delta=0;
  if(sc.length>=4){const last=sc.slice(-3),prev=sc.slice(-6,-3);delta=avgOf(last)-avgOf(prev);trend=delta>3?'up':delta<-3?'down':'flat'}
  const coaching=sc.length>=2&&sc.slice(-2).every(x=>x<tgt);
  const repeat=all.length>=3?LISTS.criteria.filter(n=>all.slice(-3).every(r=>{const v=ratingFor(r,n);return v!=null&&v<=3})):[];
  const crit=LISTS.criteria.map(n=>critAvg(all,n));
  let strong=null,weak=null;const ix=crit.map((v,i)=>i).filter(i=>crit[i]!=null);
  if(ix.length){strong=ix.reduce((a,b)=>crit[b]>crit[a]?b:a);weak=ix.reduce((a,b)=>crit[b]<crit[a]?b:a);if(crit[strong]===crit[weak]){strong=null;weak=null}}
  return {all,sc,trend,delta,coaching,repeat,crit,strong,weak,recent:avgOf(sc.slice(-6))};
}
function mostImproved(uids){let best=null;uids.forEach(u=>{const q=staffQuality(u);if(q.trend==='up'&&q.delta>5&&(!best||q.delta>best.d))best={u,d:q.delta}});return best&&best.u}
const trendBadge=t=>({up:`<span class="trend up">${ic('arrow',12).replace('<svg','<svg style="transform:rotate(-45deg)"')} Improving</span>`,down:`<span class="trend down">${ic('arrow',12).replace('<svg','<svg style="transform:rotate(45deg)"')} Slipping</span>`,flat:`<span class="trend flat">${ic('arrow',12)} Steady</span>`,new:`<span class="trend new">${ic('info',12)} Too few calls</span>`})[t];
function flagsHtml(q,uid,star){
  let h='';

async function handlePerfFile(file){
  try{
    const rows=await readSpreadsheet(file);if(rows.length<2)throw new Error('The file has no data rows');
    const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
    const find=(...keys)=>hdr.findIndex(h=>keys.some(k=>h===k||h.includes(k)));
    const ci=find('employee id','emp id','employee','emp','id'),si=find('daily performance','performance','score'),di=find('date');
    if(ci<0||si<0)throw new Error('Couldn’t find the “Employee ID” and “Score” columns');
    const toIso=v=>{if(v===''||v==null)return null;if(typeof v==='number'&&v>20000){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
      const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;return 'bad'};
    const def=ui.perfDate||iso(today()),seen=new Set();
    const out=rows.slice(1).map(r=>{const emp=String(r[ci]??'').trim();let sc=r[si];sc=typeof sc==='number'?sc:parseFloat(String(sc).replace('%','').replace(',','.'));
      if(typeof r[si]==='number'&&sc>0&&sc<=1.5)sc=sc*100;sc=isFinite(sc)?Math.round(sc*10)/10:null;
      const dd=di>=0?toIso(r[di])||def:def,u=USERS.find(x=>x.emp.toLowerCase()===emp.toLowerCase()&&x.role==='staff');
      let msg='';if(!emp)msg='No employee ID';else if(!u)msg='Employee not found';else if(sc==null)msg='Score missing';else if(dd==='bad')msg='Date not readable';else if(seen.has(u.id+dd))msg='Duplicate row';
      if(!msg&&u)seen.add(u.id+dd);
      return {emp,user:u,score:sc,date:dd==='bad'?null:dd,ok:!msg,msg}}).filter(r=>r.emp||r.score!=null);
    ui.perfPreview={file:file.name,rows:out};render();
  }catch(e){toast(e.message||'Couldn’t read the file',true)}
}

    <div class="d-section"><h4>Scores</h4><div class="bars">${critOf(r).map((c,i)=>{const v=x.ratings[i]*20;return `<div class="bar-row" style="grid-template-columns:150px 1fr 40px"><span>${esc(c)}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%;--c:${v>=90?'var(--ok)':v>=80?'var(--primary)':'var(--warn)'}"></div></div><b>${v}%</b></div>`}).join('')}</div></div>
    <div class="d-section"><h4>Feedback</h4><div class="note-box">${esc(x.feedback)}</div></div>`;
  }else if(r.kind==='mom'){
    body=`<div class="d-section"><div class="kv">${kv('Title',esc(x.title),1)+kv('Meeting date',fmtL(x.date))+kv('From',esc(user(r.createdBy).name))}</div></div>
    <div class="d-section"><h4>Summary</h4><div class="note-box">${esc(x.summary)}</div></div>${x.actions?`<div class="d-section"><h4>Action items</h4><div class="note-box">${esc(x.actions)}</div></div>`:''}`;
  }else if(r.kind==='vio'){
    body=`<div class="d-section"><div class="kv">${kv('Violation type',esc(x.vtype))+kv('Date',fmtL(x.date))+kv('Issued by',esc(user(r.createdBy).name),1)}</div></div><div class="d-section"><h4>Details</h4><div class="note-box">${esc(x.details)}</div></div>`;
  }else if(r.kind==='task'){
    body=`<div class="d-section"><div class="kv">${kv('Task',esc(x.title),1)+kv('Due',fmtL(x.due))+kv('Assigned by',esc(user(r.createdBy).name))}</div></div>${x.details?`<div class="d-section"><h4>Details</h4><div class="note-box">${esc(x.details)}</div></div>`:''}`;
  }else if(r.kind==='adh'){
    body=`<div class="d-section"><div class="kv">${kv('Staff member',esc(user(r.recipients[0]).name))+kv('Reason',esc(x.reason))+kv('Date',fmtL(x.date||x.from))+kv('Created by',esc(user(r.createdBy).name),1)}</div></div>${x.note?`<div class="d-section"><h4>Note</h4><div class="note-box">${esc(x.note)}</div></div>`:''}`;
  }
  if(r.files.length)body+=`<div class="d-section"><h4>Attachments</h4>${fileList(r.files)}</div>`;
  let foot='';
  if(r.kind==='task'){
    if(wfm){
      const done=r.recipients.filter(u=>tState(r,u).status!=='open').length;
      body+=`<div class="d-section"><h4>Assigned to · ${done}/${r.recipients.length} done</h4><div class="recip">${r.recipients.map(u=>{const t=tState(r,u);return `<div><span class="av">${initials(user(u).name)}</span>${esc(user(u).name)}${t.status==='done'?`<span class="quick" style="margin-left:auto"><button class="btn sm ret" data-action="taskReopen" data-id="${r.id}" data-u="${u}" title="Reopen">${ic('undo',14)}</button><button class="btn sm ok" data-action="taskConfirm" data-id="${r.id}" data-u="${u}">${ic('check',14)} Confirm</button></span>`:taskPill(t)}</div>${t.note?`<em class="note-box" style="display:block;font-style:normal;margin:0 0 6px 36px;font-size:12.5px">“${esc(t.note)}”</em>`:''}`}).join('')}</div>
      <textarea class="input" id="reopenComment" rows="2" placeholder="Comment if you reopen a task (optional)" style="margin-top:10px"></textarea></div>`;
    }else{
      const t=tState(r,uid);
      if(t.comment&&t.status==='open')body=callout('ret','undo',`${esc(user(t.reopenedBy).name)} reopened this`,esc(t.comment))+body;
      foot=t.status==='open'?`<div class="d-foot"><textarea class="input" id="taskNote" rows="2" placeholder="Note for your manager (optional)"></textarea><div class="row"><button class="btn ok" data-action="taskDone" data-id="${r.id}">${ic('check',16)} Mark as done</button></div></div>`
        :t.status==='done'?`<div class="d-foot"><div class="ack-done" style="color:var(--primary)">${ic('clock',16)} Done ${fmtTs(t.doneAt)} · waiting for your manager to confirm</div></div>`
        :`<div class="d-foot"><div class="ack-done">${ic('check',16)} Completed · confirmed ${fmtTs(t.confirmedAt)}</div></div>`;
    }
  }else if(wfm&&r.kind!=='adh'){
    body+=`<div class="d-section"><h4>Recipients · ${Object.keys(r.acks).length}/${r.recipients.length} acknowledged</h4><div class="recip">${r.recipients.map(id=>{const a=r.acks[id];return `<div><span class="av">${initials(user(id).name)}</span>${esc(user(id).name)}${r.requireAck?ackPill(!!a):'<span class="pill cancelled">No ack needed</span>'}</div>${a&&a.reply?`<em class="note-box" style="display:block;font-style:normal;margin:0 0 6px 36px;font-size:12.5px">“${esc(a.reply)}”</em>`:''}`}).join('')}</div></div>`;
  }else if(!wfm&&r.requireAck){
    const a=r.acks[uid];
    if(a)foot=`<div class="d-foot"><div class="ack-done">${ic('check',16)} You acknowledged this on ${fmtTs(a.at)}</div>${a.reply?`<div class="note-box">Your reply: ${esc(a.reply)}</div>`:''}</div>`;
    else foot=`<div class="d-foot"><textarea class="input" id="ackReply" rows="2" placeholder="Reply (optional)"></textarea><div class="row"><button class="btn ok" data-action="ack" data-id="${r.id}">${ic('check',16)} I’ve read this · Acknowledge</button></div></div>`;
  }
  return `<div class="sheet-handle"></div><div class="d-head">${bubble(r.kind,1,1)}<div><h3>${RECS[r.kind].name}</h3><small>${r.id} · ${fmtTs(r.createdAt)}</small></div><button class="btn icon" data-action="closeDrawer" aria-label="Close">${ic('x',18)}</button></div><div class="d-body">${body}</div>${foot}`;
}

function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast'+(err?' err':''),2600)}

function submitRequest(){
  const f=ui.form,v=f.vals,e={},uid=S.current,tIso=iso(today());
  let data={};
  if(f.type==='leave'){
    const {start,end}=f.cal;
    if(!start)e.dates='Pick your dates on the calendar';
    else{const en=end||start,pr=leaveProblem(start,en,f.editingId);if(pr)e.dates=pr;data={start,end:en,cover:v.cover||'',notes:v.notes||''}}
  }else if(f.type==='swap'||f.type==='change'){
    const st=v.start,en=v.end||v.start;
    if(!st||st<=tIso)e.start='Pick a future date';
    else if(en<st)e.end='Must be on or after the “From” date';
    else if(daysBetween(st,en)>31)e.end='Maximum 31 days per request';
    if(!e.start&&!e.end){const bl=blockedInRange(uid,f.type,st,en);if(bl.length){const b=blockOn(uid,f.type,bl[0]);e.start=`${fmt(bl[0])} is blocked by WFM${b&&b.reason?': '+b.reason:''}`}}
    const offChk=(sel,key)=>{if(v[sel]===OFF){if(!v[key])e[key]='Pick the date of the day off';else if(v[key]<=tIso)e[key]='Pick a future date'}};
    if(f.type==='swap'){if(v.myShift===OFF&&v.theirShift===OFF)e.myShift='Both can’t be days off';else if(v.myShift===v.theirShift)e.myShift='Pick different shifts — otherwise nothing changes';
      offChk('myShift','myOffDate');offChk('theirShift','theirOffDate');
      data={start:st,end:en,myShift:v.myShift,theirShift:v.theirShift,myOffDate:v.myShift===OFF?v.myOffDate:'',theirOffDate:v.theirShift===OFF?v.theirOffDate:'',reason:v.reason||''}}
    else{if(!v.requested)e.requested='Choose a shift';if(!(v.reason||'').trim())e.reason='Please give a reason';
      offChk('current','currentOffDate');offChk('requested','requestedOffDate');
      data={start:st,end:en,current:v.current,requested:v.requested,currentOffDate:v.current===OFF?v.currentOffDate:'',requestedOffDate:v.requested===OFF?v.requestedOffDate:'',reason:v.reason||''}}
  }else if(f.type==='special'){
    if(!f.prefs.length)e.prefs='Pick at least one preference';if(!(v.details||'').trim())e.details='Please explain your request';
    if(v.period==='Specific dates'&&!(v.dates||'').trim())e.dates='Enter the dates';
    {const [ma,mb]=monthRange(v.schedule);if(blockedInRange(uid,'special',ma,mb).length)e.schedule=`Requests for ${v.schedule} are blocked by WFM`}
    data={schedule:v.schedule,period:v.period,dates:v.dates||'',prefs:[...f.prefs],details:v.details||''};
  }else if(f.type==='kpi'){
    if(!v.date)e.date='Pick the date';if(!(v.justification||'').trim())e.justification='Please explain what happened';if(!f.files.length)e.files='Attach at least one supporting file';
    if(!e.date&&v.date&&blockOn(uid,'kpi',v.date))e.date=`This date is blocked by WFM: ${blockOn(uid,'kpi',v.date).reason||'no reason given'}`;
    data={kpi:v.kpi,date:v.date,justification:v.justification||''};
  }
  f.errors=e;
  if(Object.keys(e).length){render();toast('Please fix the highlighted fields',true);return}
  const status=f.type==='swap'?'waiting':'pending';
  busy(async()=>{
    if(f.editingId){
      const orig=S.requests.find(x=>x.id===f.editingId),r=clone(orig);
      r.data=data;r.files=f.files;r.status=status;if(f.type==='swap')r.partnerId=v.partnerId;const act=orig.status==='returned'?'Resubmitted':'Edited';r.history.push(mkH(act));
      await patchReq(r,orig.status);await fetchAll();ui.mineFilter='all';go('mine');toast(`${r.id} ${act==='Edited'?'updated':'resubmitted'}`);
    }else{
      const r={type:f.type,userId:uid,partnerId:f.type==='swap'?v.partnerId:null,status,data,files:f.files,history:[mkH('Submitted')]};
      const rows=await api('requests',{method:'POST',prefer:'return=representation',body:reqToDb(r)});
      await fetchAll();ui.mineFilter='all';go('mine');toast(f.type==='swap'?`Sent to ${user(v.partnerId).name} for approval`:`${rows[0].id} submitted to WFM`);
    }
  });
}
function submitRecord(){

  if(f.kind==='eval'){if(!v.date)e.date='Pick the date';if(!f.ratings.every(x=>x))e.ratings='Score every criterion';if(!(v.feedback||'').trim())e.feedback='Feedback is required';data={date:v.date,time:v.time||'',callId:v.callId||'',callType:v.callType||LISTS.call_types[0],criteria:[...LISTS.criteria],ratings:[...f.ratings],feedback:v.feedback||'',countInScore:!!v.countInScore}}

  if(f.kind==='adh'){if(!v.date)e.date='Pick the date';data={reason:v.reason,date:v.date,note:v.note||''}}
  if(f.kind==='task'){recipients=momRecipients(f);if(f.sendTo==='teams'&&!f.teams.length)e.teams='Pick at least one team';if(!recipients.length)e.teams='Nobody to assign to';if(!(v.title||'').trim())e.title='Describe the task';if(!v.due)e.due='Pick a due date';data={title:(v.title||'').trim(),details:v.details||'',due:v.due,sendTo:f.sendTo,teams:[...f.teams]}}
  if(f.kind==='mom'){recipients=momRecipients(f);if(f.sendTo==='teams'&&!f.teams.length)e.teams='Pick at least one team';if(!(v.title||'').trim())e.title='Title is required';if(!v.date)e.date='Pick the date';if(!(v.summary||'').trim())e.summary='Summary is required';data={title:v.title,date:v.date,summary:v.summary||'',actions:v.actions||'',sendTo:f.sendTo,teams:[...f.teams]}}
  f.errors=e;if(Object.keys(e).length){render();toast('Please fix the highlighted fields',true);return}
  const r={kind:f.kind,createdBy:S.current,recipients,requireAck:f.kind==='adh'||f.kind==='task'?false:!!v.requireAck,data,files:f.files};

function decide(id,d,comment){
  const r=S.requests.find(x=>x.id===id);if(!r||r.status!=='pending')return;
  if(d!=='accept'&&!comment){toast('Add a comment to '+(d==='return'?'return':'reject'),true);const c=$('#decisionComment');if(c)c.focus();return}
  const c=clone(r);c.status=d==='accept'?'approved':d==='return'?'returned':'rejected';c.history.push(mkH(d==='accept'?'Accepted':d==='return'?'Returned':'Rejected',comment));
  const fixRaw=(($('#decisionScore')||{}).value||'').trim(),fix=fixRaw===''?null:Math.round(parseFloat(fixRaw)*10)/10;
  if(r.type==='dispute'&&d==='accept'&&fixRaw!==''&&!isFinite(fix)){toast('Corrected score must be a number',true);return}
  if(r.type==='dispute'&&d==='accept'&&fix!=null){c.data.corrected=fix;c.history[c.history.length-1].comment=(comment?comment+' · ':'')+`Score corrected to ${fmtScore(fix)}`}
  busy(async()=>{await patchReq(c,'pending');if(r.type==='dispute'&&d==='accept'&&fix!=null)await api('performance?on_conflict=user_id,date',{method:'POST',prefer:'resolution=merge-duplicates',body:{user_id:r.userId,date:r.data.date,score:fix,uploaded_at:Date.now(),uploaded_by:S.current}});await fetchAll();closeDrawer();toast(`${r.id} ${d==='accept'?'accepted':d==='return'?'returned to '+user(r.userId).name:'rejected'}`)});
}
function readFiles(list){
  const f=ui.form;if(!f)return;
  const arr=[...list];let pending=arr.length;
  arr.forEach(file=>{
    if(file.size>5*1048576){toast(`${file.name} is over 5 MB`,true);if(--pending===0)render();return}
    const entry={name:file.name,size:file.size};
    if(file.size<=400*1024){const rd=new FileReader();rd.onload=()=>{entry.data=rd.result;f.files.push(entry);if(--pending===0)render()};rd.readAsDataURL(file)}
    else{f.files.push(entry);if(--pending===0)render()}
  });
}

        if(!f.id)rememberPw(f.emp.trim(),f.pw);await fetchAll();closeDrawer();toast(f.id?'User updated':`${f.name.trim()} created · temporary password: ${f.pw}`)});break}
    case 'userPw':ui.tmpPw=genPw();openDrawer('pw',id);break;
    case 'genPw':ui.tmpPw=genPw();const tp=$('#tmpPw');if(tp)tp.value=ui.tmpPw;break;
    case 'pwReset':{const pw=(($('#tmpPw')||{}).value||'').trim();if(pw.length<6){toast('Use at least 6 characters',true);break}
      busy(async()=>{await rpc('admin_reset_password',{p_id:id,p_pw:pw});rememberPw(user(id).emp,pw);await fetchAll();closeDrawer();toast(`Password reset · share it with ${user(id).name}: ${pw}`);if(id===S.current)signOut('Your password was reset. Sign in with the new one.')});break}
    case 'saveTeam':{const inp=document.querySelector(`[data-team="${id}"]`),name=(inp&&inp.value||'').trim();if(!name){toast('Team name can’t be empty',true);break}
      busy(async()=>{await api(`teams?id=eq.${id}`,{method:'PATCH',body:{name}});await fetchAll();render();toast('Team renamed')});break}
    case 'addTeam':{const name=(($('#newTeam')||{}).value||'').trim();if(!name){toast('Type a team name first',true);break}
      busy(async()=>{await api('teams',{method:'POST',body:{name,sort:Math.max(0,...TEAM_LIST.map(t=>t.sort))+1}});await fetchAll();render();toast('Team added')});break}
    case 'delTeam':if(confirm(`Delete team “${teamName(+id)}”?`))busy(async()=>{await api(`teams?id=eq.${id}`,{method:'DELETE'});await fetchAll();render();toast('Team deleted')});break;
    case 'liMove':{const k=el.dataset.k,i=+el.dataset.i,j=i+(+el.dataset.d),d=ui.listDraft[k];if(j<0||j>=d.length)break;[d[i],d[j]]=[d[j],d[i]];render();break}
    case 'liDel':{const d=ui.listDraft[el.dataset.k];if(d.length>1){d.splice(+el.dataset.i,1);render()}break}
    case 'liAdd':{const k=el.dataset.k,inp=document.querySelector(`[data-lnew="${k}"]`),v=(inp&&inp.value||'').trim();if(!v){toast('Type the new item first',true);break}
      if(ui.listDraft[k].some(x=>x.toLowerCase()===v.toLowerCase())){toast('That item is already in the list',true);break}ui.listDraft[k].push(v);render();break}
    case 'liReset':ui.listDraft[el.dataset.k]=[...LISTS[el.dataset.k]];render();break;
    case 'liSave':{const k=el.dataset.k,d=ui.listDraft[k].map(x=>String(x).trim()).filter(Boolean);
      if(!d.length){toast('A list needs at least one item',true);break}if(new Set(d.map(x=>x.toLowerCase())).size!==d.length){toast('Remove duplicate items first',true);break}
      busy(async()=>{await api('settings?on_conflict=key',{method:'POST',prefer:'resolution=merge-duplicates',body:{key:k,value:d}});await fetchAll();ui.listDraft[k]=[...LISTS[k]];render();toast(`${LIST_META[k].name} saved`)});break}
    case 'editBlock':{const b=S.rules.blocks.find(x=>x.id===id);if(!b)break;ui.blockForm={id:b.id,scope:b.scope,target:b.scope==='user'?b.target:b.scope==='team'?String(b.target):null,type:b.type,from:b.from,to:b.to,reason:b.reason||''};render();const bf=$('#blockForm');if(bf)bf.scrollIntoView({behavior:'smooth',block:'center'});break}
    case 'cancelBlockEdit':{const T=today();ui.blockForm={scope:'user',target:(staffUsers()[0]||{}).id,type:'leave',from:iso(T),to:iso(addDays(T,14)),reason:''};render();break}
    case 'perfTemplate':perfTemplate();break;
    case 'perfCancel':ui.perfPreview=null;render();break;
    case 'perfConfirm':{const ok=ui.perfPreview.rows.filter(r=>r.ok);
      busy(async()=>{await api('performance?on_conflict=user_id,date',{method:'POST',prefer:'resolution=merge-duplicates',body:ok.map(r=>({user_id:r.user.id,date:r.date,score:r.score,uploaded_at:Date.now(),uploaded_by:S.current}))});
        ui.perfPreview=null;await fetchAll();render();toast(`${ok.length} scores uploaded`)});break}
    case 'resetDemo':if(confirm('Delete ALL requests, records, blocks and performance scores for EVERYONE? Users, teams and lists are kept. This can’t be undone.')){busy(async()=>{await rpc('reset_demo');await fetchAll();ui.form=null;ui.rulesDraft=null;closeDrawer(true);if(S.current)ui.view=isWfm()?'dash':'new';render();toast('All data cleared')})}break;
    case 'nav':go(el.dataset.view);break;
    case 'pickType':ui.form=newForm(el.dataset.type);go('form');break;
    case 'calMove':{const m=ui.form.cal.month;ui.form.cal.month=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.d),1);render();break}
    case 'calInfo':ui.form.cal.info=el.dataset.d;render();break;
    case 'calPick':{const c=ui.form.cal,d=el.dataset.d;ui.form.errors.dates=null;c.info=d;
      if(!c.start||c.end||d<c.start){c.start=d;c.end=null}else if(d===c.start){c.start=null}else{const pr=leaveProblem(c.start,d,ui.form.editingId);if(pr){toast(pr,true)}else c.end=d}
      render();break}
    case 'togglePref':{const p=el.dataset.p,arr=ui.form.prefs,i=arr.indexOf(p);i>=0?arr.splice(i,1):arr.push(p);render();break}
    case 'rmFile':ui.form.files.splice(+el.dataset.i,1);render();break;
    case 'mineFilter':ui.mineFilter=el.dataset.f;render();break;
    case 'inboxFilter':ui.inboxFilter=el.dataset.f;render();break;
    case 'openReq':openDrawer('req',id);break;
    case 'openRec':openDrawer('rec',id);break;
    case 'openStaff':openDrawer('staff',id);break;
    case 'newEvalFor':ui.form=newRecForm('eval');ui.form.vals.staff=id;go('createForm');break;
    case 'exportCycle':exportCycle();break;
    case 'closeDrawer':closeDrawer();break;
    case 'decide':decide(id,el.dataset.d,(($('#decisionComment')||{}).value||'').trim());break;
    case 'quickDecide':openDrawer('req',id);setTimeout(()=>{const c=$('#decisionComment');if(c){c.focus();c.placeholder=`Comment required to ${el.dataset.d}`}},260);toast(`Add a comment, then tap ${el.dataset.d==='return'?'Return':'Reject'}`);break;
    case 'cancelReq':{if(!confirm('Cancel this request?'))break;const r=S.requests.find(x=>x.id===id),c=clone(r);c.status='cancelled';c.history.push(mkH('Cancelled'));
      busy(async()=>{await patchReq(c,r.status);await fetchAll();closeDrawer();toast(`${r.id} cancelled`)});break}
    case 'editReq':{const r=S.requests.find(x=>x.id===id);ui.form=newForm(r.type,r);ui.view='form';closeDrawer(true);render();window.scrollTo(0,0);break}
    case 'swapAnswer':{const r=S.requests.find(x=>x.id===id);if(!r||r.status!=='waiting')break;
      const c=clone(r),acc=el.dataset.a==='accept';c.status=acc?'pending':'declined';c.history.push(mkH(acc?'Colleague accepted':'Declined by colleague'));
      busy(async()=>{await patchReq(c,'waiting');await fetchAll();ui.drawer=null;closeDrawer();toast(acc?'Swap accepted · sent to WFM':'Swap declined')});break}
    case 'ack':{const reply=(($('#ackReply')||{}).value||'').trim();busy(async()=>{await rpc('ack_record',{p_id:id,p_uid:S.current,p_reply:reply});await fetchAll();render();toast('Acknowledged')});break}
    case 'pickRec':ui.form=newRecForm(el.dataset.kind);go('createForm');break;
    case 'rate':ui.form.ratings[+el.dataset.c]=+el.dataset.n;ui.form.errors.ratings=null;render();break;
    case 'toggleVal':ui.form.vals[el.dataset.name]=!ui.form.vals[el.dataset.name];render();break;
    case 'momTo':ui.form.sendTo=el.dataset.s;render();break;
    case 'momTeam':{const t=+el.dataset.t,arr=ui.form.teams,i=arr.indexOf(t);i>=0?arr.splice(i,1):arr.push(t);render();break}
    case 'limit':ui.rulesDraft.leaveLimit=Math.max(1,Math.min(50,(+ui.rulesDraft.leaveLimit||0)+(+el.dataset.d)));render();break;
    case 'qTarget':ui.rulesDraft.qualityTarget=Math.max(50,Math.min(100,(+ui.rulesDraft.qualityTarget||0)+(+el.dataset.d)));render();break;
    case 'toggleCountPending':ui.rulesDraft.countPending=!ui.rulesDraft.countPending;render();break;
    case 'saveRules':{const R=ui.rulesDraft;R.leaveLimit=Math.round(+R.leaveLimit);R.qualityTarget=Math.round(+R.qualityTarget);
      if(!(R.leaveLimit>=1&&R.leaveLimit<=50)){toast('Leave limit must be between 1 and 50',true);break}if(!(R.qualityTarget>=50&&R.qualityTarget<=100)){toast('Quality target must be between 50 and 100',true);break}
      busy(async()=>{await api('rules?id=eq.1',{method:'PATCH',body:{leave_limit:R.leaveLimit,count_pending:R.countPending,quality_target:R.qualityTarget}});await fetchAll();ui.rulesDraft=null;render();toast('Rules saved')});break}
    case 'rmBlock':busy(async()=>{await api(`blocks?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});await fetchAll();render();toast('Block removed')});break;
    case 'addBlock':{const b=ui.blockForm;
      if(!b.from||!b.to){toast('Set both dates',true);break}if(b.to<b.from){toast('“To” must be after “From”',true);break}if(!b.reason.trim()){toast('Add a reason staff will see',true);break}
      const body={scope:b.scope,target:b.scope==='all'?null:String(b.target),type:b.type,from_date:b.from,to_date:b.to,reason:b.reason.trim()};
      busy(async()=>{if(b.id)await api(`blocks?id=eq.${encodeURIComponent(b.id)}`,{method:'PATCH',body});else await api('blocks',{method:'POST',body});
        const T=today();ui.blockForm={scope:b.scope,target:b.target,type:b.type,from:iso(T),to:iso(addDays(T,14)),reason:''};await fetchAll();render();toast(b.id?'Block updated':'Block added')});break}
    case 'exportCsv':exportCsv();break;
  }
});
let drag=null;
document.addEventListener('pointerdown',ev=>{const g=ev.target.closest('.grip');if(!g)return;ev.preventDefault();const row=g.closest('.li-row');drag={row,box:row.parentElement,k:g.dataset.k};row.classList.add('dragging');try{g.setPointerCapture(ev.pointerId)}catch(e){}});
document.addEventListener('pointermove',ev=>{if(!drag)return;ev.preventDefault();const rows=[...drag.box.children].filter(r=>r!==drag.row);let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){before=r;break}}if(drag.row.nextSibling!==before)drag.box.insertBefore(drag.row,before)});
const endDrag=()=>{if(!drag)return;ui.listDraft[drag.k]=[...drag.box.querySelectorAll('input[data-li]')].map(i=>i.value);drag.row.classList.remove('dragging');drag=null;render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.drawer)closeDrawer();
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.req-card[data-action]')){ev.preventDefault();ev.target.click()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.filter){ui.filters[t.dataset.filter]=t.value;const res=$('#results');if(res)res.innerHTML=resultsHtml();return}
  if(t.dataset.bf){ui.blockForm[t.dataset.bf]=t.value;return}
  if(t.dataset.rd){ui.rulesDraft[t.dataset.rd]=t.value;return}
  if(t.dataset.li){ui.listDraft[t.dataset.li][+t.dataset.i]=t.value;return}
  if(t.dataset.pd){ui.perfDate=t.value;return}
  if(t.dataset.us){ui.userSearch=t.value;const box=$('#main');if(box){const pos=t.selectionStart;box.innerHTML=renderView();const n=$('[data-us]');if(n){n.focus();n.setSelectionRange(pos,pos)}}return}
  if(t.id==='tmpPw'){ui.tmpPw=t.value;return}
  if(ui.userForm&&t.name&&t.closest('#userForm')){ui.userForm[t.name]=t.value;return}
  if(ui.form&&t.name&&t.closest('#reqForm,#recForm')){ui.form.vals[t.name]=t.value;if(ui.form.errors[t.name]){ui.form.errors[t.name]=null;const fld=t.closest('.field');if(fld){fld.classList.remove('invalid')}}}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.matches('[data-file]')){readFiles(t.files);t.value='';return}
  if(t.dataset.member){t.checked?ui.teamSel.add(t.dataset.member):ui.teamSel.delete(t.dataset.member);renderDrawer();return}
  if(t.dataset.my){ui.my[t.dataset.my]=t.value;render();return}
  if(t.matches('[data-perf]')){const f=t.files[0];t.value='';if(f)handlePerfFile(f);return}
  if(ui.userForm&&t.name&&t.closest('#userForm')){ui.userForm[t.name]=t.value;if(t.name==='role')renderDrawer();return}
  if(t.dataset.bf==='scope'){ui.blockForm.scope=t.value;ui.blockForm.target=t.value==='user'?(staffUsers()[0]||{}).id:t.value==='team'?String((TEAM_LIST[0]||{}).id):null;render();return}
  if(t.dataset.filter){ui.filters[t.dataset.filter]=t.value;const res=$('#results');if(res)res.innerHTML=resultsHtml();return}
  if(t.dataset.q){ui.q[t.dataset.q]=t.value;if(t.dataset.q==='team')ui.q.staff='all';if(t.type==='date')return;render();return}
  if(ui.form&&t.name&&t.closest('#reqForm,#recForm')){ui.form.vals[t.name]=t.value;
    if(['date','partnerId','period','staff','current','start','myShift','theirShift','requested','sendTo'].includes(t.name))render();}
});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target;
  if(f.id==='reqForm')submitRequest();if(f.id==='recForm')submitRecord();
  if(f.id==='loginForm'){const emp=f.emp.value.trim(),pw=f.pw.value;ui.lastEmp=emp;if(!emp||!pw){toast('Enter your employee ID and password',true);return}
    busy(async()=>{const r=await rpc('login',{p_emp:emp,p_pw:pw});if(!r){toast('Wrong employee ID or password',true);return}rememberPw(emp,pw);await fetchAll();
      if(r.must_change){ui.pending={id:r.id,old:pw};render();return}signIn(r.id)})}
  if(f.id==='newPwForm'){const a=f.new1.value,b=f.new2.value;if(a.length<6){toast('Use at least 6 characters',true);return}if(a!==b){toast('The two passwords don’t match',true);return}
    if(a===ui.pending.old){toast('Choose a password different from the temporary one',true);return}
    busy(async()=>{await rpc('change_password',{p_id:ui.pending.id,p_old:ui.pending.old,p_new:a});rememberPw(user(ui.pending.id).emp,a);await fetchAll();signIn(ui.pending.id)})}
  if(f.id==='acctPwForm'){const o=f.old.value,a=f.new1.value,b=f.new2.value;if(!o){toast('Enter your current password',true);return}if(a.length<6){toast('Use at least 6 characters',true);return}if(a!==b){toast('The two new passwords don’t match',true);return}
    busy(async()=>{await rpc('change_password',{p_id:S.current,p_old:o,p_new:a});rememberPw(me().emp,a);f.reset();toast('Password updated')})}
});
document.addEventListener('dragover',ev=>{if(ev.target.closest('.drop'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const d=ev.target.closest('.drop');if(d){ev.preventDefault();readFiles(ev.dataTransfer.files)}});

/* ================= Boot ================= */
S={current:null,requests:[],records:[],perf:[],rules:{leaveLimit:2,countPending:true,qualityTarget:85,blocks:[]}};
try{S.current=localStorage.getItem(KEY)}catch(e){}
(function(){const T=today();ui.blockForm.type='leave';ui.blockForm.from=iso(T);ui.blockForm.to=iso(addDays(T,14))})();
async function boot(){
  $('#app').innerHTML=`<div class="signin-page"><div class="card"><div class="logo">${ic('layers',24)}</div><h1>WFM Requests</h1><p>Loading shared data…</p></div></div>`;
  try{
    await fetchAll();
  }catch(e){
    $('#app').innerHTML=`<div class="signin-page"><div class="card"><div class="logo">${ic('layers',24)}</div><h1>Can’t reach the database</h1><p>${esc(e.message)}. Check your internet connection — some office networks block it.</p><button class="btn primary" onclick="boot()">Try again</button></div></div>`;return;
  }
  if(S.current&&!sessionValid()){S.current=null;save()}
  if(S.current){ui.view=isWfm()?'dash':'new';if(!ui.blockForm.target)ui.blockForm.target=(staffUsers()[0]||{}).id}
  render();
}
boot();
setInterval(poll,15000);
window.addEventListener('focus',poll);
</script>
</body></html>
